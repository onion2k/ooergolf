<!doctype html>
<meta charset="utf-8" />
<meta
  name="viewport"
  content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
/>
<title>Ooergolf: the models</title>
<!-- inline, so the browser does not go asking for a /favicon.ico there is none of -->
<link
  rel="icon"
  href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='7' fill='%23e8863a'/%3E%3C/svg%3E"
/>
<style>
  :root {
    color-scheme: dark;
    --ink: #f1eee6;
    --dim: #a39f94;
    --gold: #f2c14e;
  }
  * {
    box-sizing: border-box;
  }
  html,
  body {
    margin: 0;
    height: 100%;
    background: #0b0a10;
    overflow: hidden;
  }
  body {
    font:
      14px/1.5 ui-rounded,
      'SF Pro Rounded',
      system-ui,
      sans-serif;
    color: var(--ink);
  }
  #stage {
    position: fixed;
    inset: 0;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
  }
  .panel {
    position: fixed;
    padding: 10px 14px;
    background: rgba(14, 12, 20, 0.62);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 12px;
    pointer-events: none;
  }
  #title {
    top: 16px;
    left: 16px;
  }
  #title b {
    display: block;
    font-size: 18px;
    color: var(--gold);
  }
  #title span {
    color: var(--dim);
    font-size: 12px;
  }
  #labels {
    position: fixed;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
  }
  .label {
    position: absolute;
    transform: translate(-50%, 0);
    padding: 1px 7px;
    border-radius: 6px;
    background: rgba(14, 12, 20, 0.7);
    font-size: 12px;
    white-space: nowrap;
  }
  .label.row {
    color: var(--gold);
    font-weight: 700;
  }
  #boot {
    position: fixed;
    inset: 0;
    display: grid;
    place-items: center;
    background: #0b0a10;
  }
  #boot.gone {
    display: none;
  }
  #boot p {
    color: var(--dim);
  }
  @media (max-width: 600px) {
    .label {
      font-size: 10px;
      padding: 0 5px;
    }
    #title span {
      display: none;
    }
  }
</style>
<div id="stage"><canvas id="view"></canvas></div>
<div id="labels"></div>
<div class="panel" id="title"><b>ooergolf models</b><span>?model=name to look at one</span></div>
<div id="boot">
  <p id="bootMsg">starting WebGPU…</p>
</div>
<script type="module" src="/src/showcase.ts"></script>
