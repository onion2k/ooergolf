<!doctype html>
<meta charset="utf-8" />
<meta
  name="viewport"
  content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
/>
<title>Ooergolf</title>
<!-- inline, so the browser does not go asking for a /favicon.ico there is none of -->
<link
  rel="icon"
  href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='7' fill='%23e8863a'/%3E%3C/svg%3E"
/>
<style>
  :root {
    color-scheme: dark;
    --ink: #f1eee6;
    --dim: #a39f94;
    --gold: #f2c14e;
  }
  * {
    box-sizing: border-box;
  }
  html,
  body {
    margin: 0;
    height: 100%;
    background: #0b0a10;
    overflow: hidden;
  }
  body {
    font:
      14px/1.5 ui-rounded,
      'SF Pro Rounded',
      system-ui,
      sans-serif;
    color: var(--ink);
  }
  #stage {
    position: fixed;
    inset: 0;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
    /* a drag on the course is a shot, never a scroll or a zoom of the page */
    touch-action: none;
  }
  .panel {
    position: fixed;
    padding: 10px 14px;
    background: rgba(14, 12, 20, 0.62);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 12px;
    backdrop-filter: blur(8px);
    pointer-events: none;
  }
  #strokes {
    top: 16px;
    left: 16px;
    font-size: 15px;
  }
  #strokes b {
    display: block;
    font-size: 30px;
    font-weight: 700;
    color: var(--gold);
    font-variant-numeric: tabular-nums;
  }
  #strokes small {
    display: block;
    color: var(--dim);
    font-size: 12px;
  }
  #toast {
    top: 22%;
    left: 50%;
    transform: translateX(-50%);
    font-size: 30px;
    font-weight: 700;
    padding: 12px 26px;
    color: var(--gold);
    white-space: nowrap;
  }
  #card {
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: min(360px, calc(100vw - 32px));
    padding: 18px 20px;
    pointer-events: auto;
  }
  #card h2 {
    margin: 0 0 10px;
    font-size: 20px;
  }
  #card table {
    width: 100%;
    border-collapse: collapse;
    font-variant-numeric: tabular-nums;
  }
  #card th,
  #card td {
    text-align: left;
    padding: 4px 6px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.08);
  }
  #card th {
    color: var(--dim);
    font-weight: 400;
  }
  #card td:nth-child(n + 3),
  #card th:nth-child(n + 3) {
    text-align: right;
  }
  #card tfoot td {
    font-weight: 700;
    color: var(--gold);
    border: 0;
  }
  #cardCourses,
  #cardShop {
    margin-top: 8px;
    width: 100%;
    background: rgba(255, 255, 255, 0.12);
    color: var(--ink);
  }
  #again {
    margin-top: 14px;
    width: 100%;
    padding: 10px;
    font: inherit;
    font-weight: 700;
    color: #1a1420;
    background: var(--gold);
    border: 0;
    border-radius: 8px;
    cursor: pointer;
  }
  #purse {
    top: 16px;
    right: 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    pointer-events: auto;
    font-variant-numeric: tabular-nums;
  }
  #purse b {
    color: var(--gold);
  }
  #purse i {
    font-style: normal;
    color: #7fd6ff;
  }
  #purse em {
    font-style: normal;
  }
  #purse b::before {
    content: '\25cf  ';
  }
  #purse i::before {
    content: '\25c6  ';
  }
  button.small {
    padding: 5px 12px;
    font: inherit;
    font-weight: 700;
    color: #1a1420;
    background: var(--gold);
    border: 0;
    border-radius: 7px;
    cursor: pointer;
  }
  #shop {
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: min(400px, calc(100vw - 32px));
    padding: 18px 20px;
    pointer-events: auto;
  }
  #shop h2 {
    margin: 0 0 4px;
    font-size: 20px;
  }
  #shop p {
    margin: 0 0 12px;
    color: var(--dim);
  }
  .club {
    display: grid;
    grid-template-columns: 26px 1fr auto;
    align-items: center;
    gap: 10px;
    padding: 8px 0;
    border-bottom: 1px solid rgba(255, 255, 255, 0.08);
  }
  .club .swatch {
    width: 26px;
    height: 26px;
    border-radius: 50%;
    box-shadow: inset -4px -5px 8px rgba(0, 0, 0, 0.35);
  }
  .club small {
    display: block;
    color: var(--dim);
  }
  .club button:disabled {
    background: rgba(255, 255, 255, 0.12);
    color: var(--dim);
    cursor: default;
  }
  #shopClose {
    margin-top: 14px;
    width: 100%;
  }
  #start {
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: min(380px, calc(100vw - 32px));
    padding: 22px 22px 18px;
    text-align: center;
    pointer-events: auto;
  }
  #start h1 {
    margin: 0;
    font-size: 34px;
    color: var(--gold);
    letter-spacing: 0.02em;
  }
  #start p {
    margin: 2px 0 16px;
    color: var(--dim);
  }
  #courses {
    display: grid;
    gap: 10px;
  }
  .course {
    display: block;
    width: 100%;
    padding: 12px 14px;
    font: inherit;
    text-align: left;
    color: var(--ink);
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.14);
    border-radius: 10px;
    cursor: pointer;
  }
  .course:hover {
    border-color: var(--gold);
  }
  .course b {
    display: block;
    font-size: 18px;
  }
  .course small {
    color: var(--dim);
  }
  #stats {
    bottom: 16px;
    right: 16px;
    text-align: right;
    color: var(--dim);
    font-size: 12px;
  }
  #help {
    bottom: 16px;
    left: 16px;
    color: var(--dim);
    font-size: 13px;
  }
  #boot {
    position: fixed;
    inset: 0;
    display: grid;
    place-items: center;
    background: #0b0a10;
    transition: opacity 0.4s;
  }
  #boot.gone {
    opacity: 0;
    pointer-events: none;
  }
  #boot p {
    color: var(--dim);
  }
  @media (max-width: 600px) {
    #stats,
    #purse em {
      display: none;
    }
    #purse {
      gap: 8px;
      padding: 8px 10px;
    }
  }
</style>
<div id="stage"><canvas id="view"></canvas></div>
<div class="panel" id="strokes" hidden><small id="holeName"></small><b>0</b>strokes <span id="holePar"></span></div>
<div class="panel" id="toast" hidden></div>
<div class="panel" id="card" hidden>
  <h2>The card</h2>
  <table>
    <thead>
      <tr>
        <th>#</th>
        <th>Hole</th>
        <th>Par</th>
        <th>Score</th>
      </tr>
    </thead>
    <tbody id="cardRows"></tbody>
    <tfoot>
      <tr>
        <td colspan="3">Total</td>
        <td id="cardTotal"></td>
      </tr>
    </tfoot>
  </table>
  <button id="again">Play again</button>
  <button id="cardCourses" class="small">Courses</button>
  <button id="cardShop" class="small">Visit the shop</button>
</div>
<div class="panel" id="purse" hidden>
  <span><b id="coins">0</b><em> coins</em></span
  ><span><i id="gems">0</i><em> gems</em></span
  ><button class="small" id="shopOpen">Shop</button>
</div>
<div class="panel" id="shop" hidden>
  <h2>The pro shop</h2>
  <p>A finer putter strikes harder, and its aim reaches further.</p>
  <div id="shopClubs"></div>
  <button class="small" id="shopClose">Back to the course</button>
</div>
<div class="panel" id="start" hidden>
  <h1>ooergolf</h1>
  <p>Choose a course</p>
  <div id="courses"></div>
</div>
<div class="panel" id="stats" hidden></div>
<div class="panel" id="help" hidden>drag back and let go to putt</div>
<div id="boot">
  <p id="bootMsg">starting WebGPU…</p>
</div>
<script type="module" src="/src/main.ts"></script>
