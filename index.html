<!doctype html>
<meta charset="utf-8" />
<meta
  name="viewport"
  content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
/>
<title>Ooergolf</title>
<!-- inline, so the browser does not go asking for a /favicon.ico there is none of -->
<link
  rel="icon"
  href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='7' fill='%23e8863a'/%3E%3C/svg%3E"
/>
<style>
  /*
   * The words over the course, as a toy's: bright solid panels with a thick
   * coloured edge standing on a lip of a deeper shade, chunky round-ended
   * buttons that sink when pressed, and every panel springing in and
   * shrinking away. The panels are solid so a word reads the same over any
   * part of the course; the smoke tests hold every text to 4.5:1 against its
   * panel, which a see-through panel could never promise. Every colour is
   * one of the palette here.
   */
  :root {
    color-scheme: light;
    --ink: #1c2340;
    --ink-soft: #4d5578;
    --paper: #ffffff;
    --mist: #e9edf6;
    --mist-deep: #c3cbe0;
    --sky: #3d9bff;
    --sky-deep: #1a67d6;
    --sky-ink: #0f4fa8;
    --sky-tint: #e3f0ff;
    --sky-face: #57b4ff;
    --title: #1b4fd8;
    --flag: #ed332b;
    --flag-deep: #b81f19;
    --sun: #ffcf33;
    --sun-hover: #ffda5c;
    --sun-deep: #d99a00;
    --sun-ink: #5a3b00;
    --leaf: #4cd070;
    --leaf-deep: #229a48;
    --leaf-ink: #146b34;
    --leaf-tint: #d9f6e2;
    --orange: #ffa53d;
    --orange-deep: #e07a0b;
    --orange-ink: #8a4a00;
    --grape: #b58cff;
    --grape-deep: #7a52e6;
    --grape-ink: #4a2da6;
    --rose: #ff7a9a;
    --rose-deep: #d63f68;
    --teal: #38d1c0;
    --teal-deep: #159888;
    --water: #2bb8ea;
    --water-deep: #1487b8;
    --water-ink: #0a5a86;
    --stone: #9aa3bd;
    --boot: #bfe3ff;
    --shade: rgba(20, 32, 72, 0.3);
    /* a damped spring, a fifth past its mark and back, for a panel arriving */
    --spring: linear(
      0,
      0.14 4.2%,
      0.444 8.3%,
      0.767 12.5%,
      1.018 16.7%,
      1.162 20.8%,
      1.205 25%,
      1.178 29.2%,
      1.116 33.3%,
      1.05 37.5%,
      0.998 41.7%,
      0.967 45.8%,
      0.958 50%,
      0.963 54.2%,
      0.976 58.3%,
      0.989 62.5%,
      1 66.7%,
      1.007 70.8%,
      1.009 75%,
      1.005 83.3%,
      1
    );
    /* a looser one, a quarter past, for the score popping in */
    --pop: linear(
      0,
      0.137 3.6%,
      0.444 7.1%,
      0.78 10.7%,
      1.049 14.3%,
      1.207 17.9%,
      1.254 21.4%,
      1.219 25%,
      1.141 28.6%,
      1.056 32.1%,
      0.987 35.7%,
      0.947 39.3%,
      0.936 42.9%,
      0.944 46.4%,
      0.964 50%,
      0.986 53.6%,
      1.003 57.1%,
      1.013 60.7%,
      1.016 64.3%,
      1.009 71.4%,
      0.999 78.6%,
      0.996 85.7%,
      1
    );
    /* a panel leaving draws back a little before it goes, a short spring the other way */
    --leave: cubic-bezier(0.36, 0, 0.66, -0.56);
  }
  * {
    box-sizing: border-box;
  }
  html,
  body {
    margin: 0;
    height: 100%;
    background: var(--boot);
    overflow: hidden;
  }
  body {
    font:
      15px/1.4 ui-rounded,
      'SF Pro Rounded',
      system-ui,
      sans-serif;
    color: var(--ink);
  }
  #stage {
    position: fixed;
    inset: 0;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
    /* a drag on the course is a shot, never a scroll or a zoom of the page */
    touch-action: none;
  }

  /* ---- a panel, and how it comes and goes ---- */

  .panel {
    --edge: var(--sky);
    --lip: var(--sky-deep);
    padding: 10px 14px;
    color: var(--ink);
    background: var(--paper);
    border: 4px solid var(--edge);
    border-radius: 18px;
    box-shadow:
      0 5px 0 var(--lip),
      0 12px 24px var(--shade);
    /* the course is struck through the words over it; only the panels with buttons take a pointer */
    pointer-events: none;
    transition:
      scale 460ms var(--spring),
      opacity 120ms linear,
      display 460ms allow-discrete;
  }
  /* hidden, a panel stays drawn while it shrinks away, and takes no pointer as it goes */
  .panel[hidden] {
    scale: 0.8;
    opacity: 0;
    transition:
      scale 180ms var(--leave),
      opacity 180ms ease-in,
      display 180ms allow-discrete;
  }
  @starting-style {
    .panel:not([hidden]) {
      scale: 0.6;
      opacity: 0;
    }
  }
  #purse:not([hidden]),
  #viewMode:not([hidden]),
  #bag:not([hidden]),
  #card:not([hidden]),
  #shop:not([hidden]),
  #start:not([hidden]) {
    pointer-events: auto;
  }

  /* ---- buttons: chunky, round-ended, standing on a lip they sink onto when pressed ---- */

  .panel button {
    min-height: 44px;
    padding: 0 20px;
    font: inherit;
    font-size: 16px;
    font-weight: 800;
    line-height: 1.1;
    color: var(--ink);
    background: var(--sun);
    border: 0;
    border-radius: 999px;
    box-shadow: 0 4px 0 var(--sun-deep);
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition:
      translate 90ms ease-out,
      box-shadow 90ms ease-out,
      background-color 90ms linear;
  }
  @media (hover: hover) {
    .panel button:hover {
      background: var(--sun-hover);
      translate: 0 -1px;
      box-shadow: 0 5px 0 var(--sun-deep);
    }
    .panel button.quiet:hover {
      background: var(--sky-tint);
      box-shadow:
        inset 0 0 0 3px var(--sky),
        0 5px 0 var(--sky-deep);
    }
  }
  .panel button:active {
    translate: 0 4px;
    box-shadow: 0 0 0 var(--sun-deep);
  }
  .panel button:focus-visible {
    outline: 3px solid var(--title);
    outline-offset: 3px;
  }
  .panel button.quiet {
    background: var(--paper);
    box-shadow:
      inset 0 0 0 3px var(--sky),
      0 4px 0 var(--sky-deep);
  }
  .panel button.quiet:active {
    box-shadow:
      inset 0 0 0 3px var(--sky),
      0 0 0 var(--sky-deep);
  }
  .panel button:disabled {
    color: var(--ink-soft);
    background: var(--mist);
    box-shadow: 0 4px 0 var(--mist-deep);
    translate: none;
    cursor: default;
  }

  /* ---- the hole and strokes, and the purse: across the top, never over each other ---- */

  #top {
    position: fixed;
    top: calc(16px + env(safe-area-inset-top, 0px));
    left: 16px;
    right: 16px;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 10px;
    pointer-events: none;
  }
  /*
   * which hole over its name, and the strokes under it beside the word and the par, a stack narrow enough for a
   * phone beside the purse
   */
  #strokes {
    grid-template-columns: auto 1fr;
    column-gap: 8px;
    min-width: 0;
    padding: 8px 16px 10px;
    transform-origin: top left;
  }
  #strokes:not([hidden]) {
    display: grid;
  }
  #holeName,
  #strokes .count {
    display: contents;
  }
  #holeName .of {
    grid-area: 1 / 1 / 2 / -1;
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    white-space: nowrap;
    color: var(--ink-soft);
  }
  #holeName .name {
    grid-area: 2 / 1 / 3 / -1;
    margin-bottom: 4px;
    font-size: 17px;
    font-weight: 800;
    line-height: 1.2;
  }
  #strokes b {
    grid-area: 3 / 1 / 5 / 2;
    align-self: center;
    font-size: 36px;
    font-weight: 900;
    line-height: 1;
    color: var(--ink);
    font-variant-numeric: tabular-nums;
  }
  #strokes .unit {
    grid-area: 3 / 2;
    align-self: end;
    font-size: 14px;
    font-weight: 700;
    line-height: 1.15;
    color: var(--ink-soft);
  }
  #holePar {
    grid-area: 4 / 2;
    justify-self: start;
    align-self: start;
    margin-top: 3px;
    padding: 1px 8px;
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    white-space: nowrap;
    color: var(--sky-ink);
    background: var(--sky-tint);
    border-radius: 999px;
  }
  /* how far the pin is, and how much higher or lower, in a line under the strokes on a golf hole */
  #pin {
    grid-area: 5 / 1 / 6 / -1;
    margin-top: 6px;
    font-size: 13px;
    font-weight: 800;
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
    color: var(--ink-soft);
  }
  /*
   * the wind, in a line under the pin on a golf hole: an arrow that points the way it blows across the screen (the page
   * turns it with the camera) and how hard, in whole miles an hour, or the word calm with no arrow
   */
  #wind {
    grid-area: 6 / 1 / 7 / -1;
    align-items: center;
    gap: 3px;
    margin-top: 0;
    font-size: 13px;
    font-weight: 800;
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
    color: var(--ink-soft);
  }
  #wind:not([hidden]) {
    display: flex;
  }
  #windArrow {
    width: 16px;
    height: 16px;
    /* room to turn in, so a corner of the arrow turned a half way round stays in its line */
    margin: 3px;
    flex: none;
    fill: currentColor;
  }
  #wind[data-calm] #windArrow {
    display: none;
  }
  /*
   * how fast the greens run, and the break of the putt the ball lies for, under the wind on a hole that has a contour: the
   * putt's line is allowed to wrap and adds nothing to the panel's width (zero wide, filling what the panel is), so it never
   * widens the panel past the purse on a phone
   */
  #greens,
  #putt {
    grid-column: 1 / -1;
    font-size: 12px;
    font-weight: 800;
    line-height: 1.25;
    color: var(--ink-soft);
  }
  #greens {
    grid-row: 7;
    margin-top: 2px;
    white-space: nowrap;
  }
  #putt {
    grid-row: 8;
    width: 0;
    min-width: 100%;
    margin-top: 2px;
    white-space: normal;
    font-variant-numeric: tabular-nums;
  }
  /*
   * the map of a golf hole, at the left edge halfway down where neither the words at the top nor the bag and switch
   * at the bottom are: a picture over the course, which a finger passes through to aim
   */
  #holePanel {
    position: fixed;
    left: 16px;
    top: 50%;
    translate: 0 -50%;
    padding: 5px;
    border-width: 3px;
    border-radius: 14px;
    transform-origin: left center;
  }
  #holePanel:not([hidden]) {
    display: block;
  }
  #holeMap {
    display: block;
    border-radius: 8px;
    image-rendering: pixelated;
  }
  #purse {
    flex: none;
    margin-left: auto;
    align-items: center;
    gap: 14px;
    padding: 6px 6px 6px 16px;
    font-size: 17px;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    border-radius: 999px;
    transform-origin: top right;
  }
  #purse:not([hidden]) {
    display: flex;
  }
  #purse .coin,
  #purse .gem {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    white-space: nowrap;
  }
  /* a coin and a gem drawn, not written, so they are pictures and not words */
  #purse .coin::before {
    content: '';
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: var(--sun);
    box-shadow:
      inset 0 0 0 2.5px var(--sun-deep),
      inset 0 -3px 0 1px rgba(90, 59, 0, 0.12);
  }
  #purse .gem::before {
    content: '';
    width: 14px;
    height: 14px;
    margin: 0 2px;
    rotate: 45deg;
    border-radius: 3px;
    background: var(--water);
    box-shadow: inset 0 0 0 2.5px var(--water-deep);
  }
  #purse b,
  #purse i {
    font-style: normal;
    color: var(--ink);
  }
  #purse em {
    font-style: normal;
    font-size: 14px;
    font-weight: 700;
    color: var(--ink-soft);
  }
  #purse button {
    padding: 0 18px;
  }

  /* ---- the word over the course when a hole is done, or the ball is in the water ---- */

  #toast {
    position: fixed;
    top: 20%;
    left: 50%;
    width: max-content;
    max-width: calc(100vw - 32px);
    padding: 6px 30px 10px;
    font-size: clamp(38px, 10vw, 64px);
    font-weight: 900;
    line-height: 1.1;
    letter-spacing: -0.01em;
    text-align: center;
    text-wrap: balance;
    color: var(--sky-ink);
    border-width: 5px;
    border-radius: 26px;
    box-shadow:
      0 7px 0 var(--lip),
      0 16px 32px var(--shade);
    translate: -50% 0;
    rotate: -3deg;
    transition:
      scale 620ms var(--pop),
      rotate 620ms var(--pop),
      opacity 100ms linear,
      display 620ms allow-discrete;
  }
  #toast[hidden] {
    transition:
      scale 180ms var(--leave),
      opacity 180ms ease-in,
      display 180ms allow-discrete;
  }
  @starting-style {
    #toast:not([hidden]) {
      scale: 0.3;
      rotate: -14deg;
      opacity: 0;
    }
  }
  #toast[data-kind='ace'] {
    --edge: var(--paper);
    --lip: var(--sun-deep);
    color: var(--sun-ink);
    background: var(--sun);
  }
  #toast[data-kind='under'] {
    --edge: var(--leaf);
    --lip: var(--leaf-deep);
    color: var(--leaf-ink);
  }
  #toast[data-kind='over'] {
    --edge: var(--grape);
    --lip: var(--grape-deep);
    color: var(--grape-ink);
  }
  #toast[data-kind='picked'] {
    --edge: var(--mist-deep);
    --lip: var(--stone);
    color: var(--ink-soft);
  }
  #toast[data-kind='splash'],
  #toast[data-kind='out'] {
    --edge: var(--water);
    --lip: var(--water-deep);
    color: var(--water-ink);
    font-size: clamp(28px, 7vw, 40px);
  }
  #toast[data-kind='out'] {
    --edge: var(--orange);
    --lip: var(--orange-deep);
    color: var(--orange-ink);
  }

  /* ---- the card, the shop and the start screen: in the middle, over everything ---- */

  #card,
  #shop,
  #start {
    position: fixed;
    top: 50%;
    left: 50%;
    max-height: calc(100% - 32px);
    overflow: auto;
    padding: 18px 20px 22px;
    border-width: 5px;
    border-radius: 26px;
    box-shadow:
      0 7px 0 var(--lip),
      0 18px 40px var(--shade);
    translate: -50% -50%;
    /* over the bag and the rest of the chrome, which are later in the page and stood over the shop's button on a short phone */
    z-index: 2;
  }
  #card h2,
  #shop h2 {
    margin: 0 0 8px;
    font-size: 24px;
    font-weight: 900;
    line-height: 1.2;
    letter-spacing: -0.01em;
  }
  #card {
    --edge: var(--leaf);
    --lip: var(--leaf-deep);
    width: min(380px, calc(100vw - 32px));
  }
  #card table {
    width: 100%;
    border-collapse: collapse;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }
  #card th {
    padding: 0 6px 6px;
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 0.08em;
    text-align: left;
    text-transform: uppercase;
    color: var(--ink-soft);
  }
  #card td {
    padding: 3px 6px;
    border-top: 2px solid var(--mist);
  }
  #card tbody td:first-child {
    color: var(--ink-soft);
  }
  #card td:nth-child(n + 3),
  #card th:nth-child(n + 3) {
    text-align: right;
  }
  /* a golfer's card circles a score under par and boxes one over */
  #card .mark {
    display: inline-grid;
    place-items: center;
    min-width: 26px;
    height: 26px;
    padding: 0 4px;
    border-radius: 999px;
  }
  #card .mark[data-kind='ace'] {
    background: var(--sun);
    box-shadow: inset 0 0 0 2px var(--sun-deep);
  }
  #card .mark[data-kind='under'] {
    color: var(--leaf-ink);
    box-shadow: inset 0 0 0 2px var(--leaf-deep);
  }
  #card .mark[data-kind='over'] {
    color: var(--grape-ink);
    border-radius: 6px;
    box-shadow: inset 0 0 0 2px var(--grape);
  }
  #card tfoot td {
    padding-top: 10px;
    font-size: 18px;
    font-weight: 900;
    color: var(--ink);
    border-top: 3px solid var(--ink);
  }
  #card #cardTotal {
    text-align: right;
    white-space: nowrap;
  }
  #again {
    display: block;
    width: 100%;
    min-height: 52px;
    margin-top: 16px;
    font-size: 19px;
  }
  .pair {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-top: 14px;
  }
  .pair button {
    padding: 0 10px;
  }

  #shop {
    --edge: var(--grape);
    --lip: var(--grape-deep);
    width: min(420px, calc(100vw - 32px));
  }
  #shop p {
    margin: 0 0 8px;
    font-weight: 600;
    color: var(--ink-soft);
  }
  .club {
    display: grid;
    grid-template-columns: 34px 1fr auto;
    align-items: center;
    gap: 12px;
    padding: 9px 0;
    border-top: 2px solid var(--mist);
    font-weight: 800;
  }
  .club small {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: var(--ink-soft);
  }
  /* each putter's head as a little toy ball of its colour */
  .club .swatch {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    box-shadow:
      inset -5px -6px 0 rgba(20, 32, 72, 0.18),
      inset 4px 4px 0 rgba(255, 255, 255, 0.4),
      0 0 0 2px rgba(20, 32, 72, 0.12);
  }
  .club button {
    min-width: 88px;
    padding: 0 16px;
  }
  /* the club in hand is not a button to press but a badge */
  .panel .club button.held:disabled {
    color: var(--leaf-ink);
    background: var(--leaf-tint);
    box-shadow: inset 0 0 0 2px var(--leaf);
  }
  #shopClose {
    width: 100%;
    margin-top: 12px;
  }

  #start {
    --edge: var(--sky);
    --lip: var(--sky-deep);
    width: min(560px, calc(100vw - 32px));
    padding: 22px 22px 26px;
    text-align: center;
  }
  #start h1 {
    margin: 0;
    font-size: 54px;
    font-weight: 900;
    line-height: 1.05;
    letter-spacing: -0.02em;
    color: var(--title);
    text-shadow: 0 4px 0 var(--sun);
  }
  #start p {
    margin: 10px 0 18px;
    font-size: 16px;
    font-weight: 700;
    color: var(--ink-soft);
  }
  #courses {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
    gap: 18px 16px;
  }
  /* a heading for each kind of game runs across the grid; the cards count among the buttons only (nth-of-type), so
     the colours go round the courses as they did before there were headings */
  #courses h2 {
    grid-column: 1 / -1;
    margin: 0;
    font-size: 15px;
    font-weight: 900;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    text-align: left;
    color: var(--ink-soft);
  }
  #courses h2:not(:first-child) {
    margin-top: 6px;
  }
  /* a card for each course, a colour each, striped as a mown green is */
  #courses .course {
    --face: var(--leaf);
    --deep: var(--leaf-deep);
    position: relative;
    display: grid;
    align-content: start;
    gap: 4px;
    min-height: 128px;
    padding: 16px 18px 18px;
    text-align: left;
    color: var(--ink);
    background: var(--face) repeating-linear-gradient(-45deg, rgba(255, 255, 255, 0.16) 0 16px, transparent 16px 32px);
    border-radius: 22px;
    box-shadow:
      inset 0 0 0 3px rgba(255, 255, 255, 0.5),
      0 6px 0 var(--deep),
      0 12px 20px var(--shade);
  }
  #courses .course:nth-of-type(6n + 2) {
    --face: var(--orange);
    --deep: var(--orange-deep);
  }
  #courses .course:nth-of-type(6n + 3) {
    --face: var(--sky-face);
    --deep: var(--sky-deep);
  }
  #courses .course:nth-of-type(6n + 4) {
    --face: var(--grape);
    --deep: var(--grape-deep);
  }
  #courses .course:nth-of-type(6n + 5) {
    --face: var(--rose);
    --deep: var(--rose-deep);
  }
  #courses .course:nth-of-type(6n + 6) {
    --face: var(--teal);
    --deep: var(--teal-deep);
  }
  @media (hover: hover) {
    #courses .course:hover {
      translate: 0 -2px;
      box-shadow:
        inset 0 0 0 3px rgba(255, 255, 255, 0.7),
        0 8px 0 var(--deep),
        0 14px 22px var(--shade);
    }
  }
  #courses .course:active {
    translate: 0 5px;
    box-shadow:
      inset 0 0 0 3px rgba(255, 255, 255, 0.5),
      0 1px 0 var(--deep),
      0 4px 8px var(--shade);
  }
  .course b {
    font-size: 26px;
    font-weight: 900;
    line-height: 1.1;
  }
  /* how many holes and the par, each on a white pill */
  .course small {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 4px;
  }
  .course small span {
    padding: 3px 11px;
    font-size: 14px;
    font-weight: 800;
    color: var(--ink);
    background: var(--paper);
    border-radius: 999px;
    box-shadow: 0 2px 0 var(--deep);
  }
  /* a round button to go, drawn: a white disc with a triangle on it */
  .course::before {
    content: '';
    position: absolute;
    right: 14px;
    bottom: 14px;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: var(--paper);
    box-shadow: 0 3px 0 var(--deep);
  }
  .course::after {
    content: '';
    position: absolute;
    right: 28px;
    bottom: 27px;
    border-style: solid;
    border-width: 9px 0 9px 15px;
    border-color: transparent transparent transparent var(--deep);
  }

  @media (max-width: 600px) {
    /* six cards fit a tall phone's screen at this height, and a short one scrolls */
    #courses {
      gap: 12px 16px;
    }
    #courses h2 {
      font-size: 13px;
      margin-top: -4px;
    }
    #courses h2:not(:first-child) {
      margin-top: 0;
    }
    #courses .course {
      min-height: 88px;
      padding: 10px 16px 12px;
    }
    .course b {
      font-size: 23px;
    }
  }

  /* ---- the corners at the bottom: how to putt, and the frame's cost ---- */

  #help,
  #stats {
    position: fixed;
    bottom: calc(16px + env(safe-area-inset-bottom, 0px));
    padding: 6px 14px;
    font-size: 13px;
    font-weight: 700;
    color: var(--ink-soft);
    border-width: 3px;
    border-radius: 999px;
    box-shadow:
      0 3px 0 var(--lip),
      0 8px 16px var(--shade);
  }
  #help {
    left: 16px;
    transform-origin: bottom left;
  }
  #stats {
    right: 16px;
    font-variant-numeric: tabular-nums;
    transform-origin: bottom right;
  }

  /*
   * the switch between aiming and looking round, at the bottom right above the frame's cost: two chunky pills in one
   * panel, the one that is on standing up in the sun's yellow and the other quiet, so it shows the state and both
   * ways to change it
   */
  #viewMode {
    position: fixed;
    right: 16px;
    bottom: calc(16px + 40px + env(safe-area-inset-bottom, 0px));
    gap: 4px;
    padding: 4px;
    border-radius: 999px;
    transform-origin: bottom right;
  }
  #viewMode:not([hidden]) {
    display: flex;
  }
  #viewMode button {
    min-width: 64px;
    padding: 0 16px;
  }
  /*
   * the flag beside them turns the camera to face the cup: a quiet pill with a picture and no word, as narrow as a thumb
   * allows, pressed and let go and never left on, so it is not one of the pair that say what a drag is
   */
  #viewMode #viewFlag {
    display: grid;
    place-items: center;
    min-width: 44px;
    padding: 0;
  }
  #viewFlag svg {
    width: 29px;
    height: 29px;
    pointer-events: none;
  }
  #viewMode button[aria-pressed='false'] {
    background: var(--paper);
    box-shadow:
      inset 0 0 0 3px var(--sky),
      0 4px 0 var(--sky-deep);
  }
  #viewMode button[aria-pressed='false']:active {
    box-shadow:
      inset 0 0 0 3px var(--sky),
      0 0 0 var(--sky-deep);
  }
  @media (max-width: 600px) {
    /*
     * the map stands on the bag, at the left edge, and not at a share of the height: the hole's words above it grow a
     * line for a long name, and the bag below is as tall as 150px (its words on two lines), so the map keeps a gap from
     * the bag and leaves the rest to the words
     */
    #holePanel {
      top: auto;
      bottom: calc(16px + 150px + 24px + env(safe-area-inset-bottom, 0px));
      translate: none;
    }
    /* on a phone the switch sits under the coins and the shop, at the top right, which leaves the foot of the screen to the bag */
    #viewMode {
      top: calc(16px + 64px + 10px + env(safe-area-inset-top, 0px));
      bottom: auto;
    }
    /*
     * the pills are no wider than their words need, and a little narrower than that of the desk's, so the three together
     * are 174px and stand 19px clear of the hole's panel on the narrowest phone, where they were 186 and 7
     */
    #viewMode button {
      min-width: 52px;
      padding: 0 10px;
    }
    /* and the instruction to drag back is not wanted on a phone: a player finds it */
    #help {
      display: none;
    }
  }

  /*
   * the bag, on a golf hole: the clubs in a row at the bottom middle, the one in hand standing up in the sun's
   * yellow as the switch's is, and above them what it is and how far it carries. On a phone it sits above the switch,
   * and the buttons are as narrow as their two letters allow, so all eight fit across
   */
  #bag {
    position: fixed;
    left: 50%;
    bottom: calc(16px + env(safe-area-inset-bottom, 0px));
    translate: -50% 0;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    max-width: calc(100vw - 32px);
    padding: 4px 6px 6px;
    border-radius: 24px;
    transform-origin: bottom center;
  }
  #bag:not([hidden]) {
    display: flex;
  }
  #bagInfo {
    font-size: 13px;
    font-weight: 700;
    color: var(--ink-soft);
    font-variant-numeric: tabular-nums;
  }
  #bagClubs {
    display: flex;
    gap: 3px;
  }
  /*
   * the shape and the spin of a lofted shot: two buttons that each cycle through three, side by side across the width
   * of the clubs below them, so the bag is no wider for them and a longer word on one never moves the other
   */
  #bagShaping {
    align-self: stretch;
    grid-template-columns: 1fr 1fr;
    gap: 3px;
  }
  #bagShaping:not([hidden]) {
    display: grid;
  }
  #bagShaping button {
    min-width: 0;
    padding: 0 8px;
    white-space: nowrap;
  }
  #bag button {
    min-width: 44px;
    padding: 0 8px;
    font-size: 15px;
  }
  /* straight and flat are the quiet buttons they were; a shape or a spin chosen stands up in the sun's yellow */
  #bagShaping button[data-shape='0'],
  #bagShaping button[data-spin='0'] {
    background: var(--paper);
    box-shadow:
      inset 0 0 0 3px var(--sky),
      0 4px 0 var(--sky-deep);
  }
  #bagShaping button[data-shape='0']:active,
  #bagShaping button[data-spin='0']:active {
    box-shadow:
      inset 0 0 0 3px var(--sky),
      0 0 0 var(--sky-deep);
  }
  #bag button[aria-pressed='false'] {
    background: var(--paper);
    box-shadow:
      inset 0 0 0 3px var(--sky),
      0 4px 0 var(--sky-deep);
  }
  #bag button[aria-pressed='false']:active {
    box-shadow:
      inset 0 0 0 3px var(--sky),
      0 0 0 var(--sky-deep);
  }
  @media (max-width: 600px) {
    #bag {
      bottom: calc(16px + env(safe-area-inset-bottom, 0px));
    }
    #bag button {
      min-width: 36px;
      padding: 0 5px;
      font-size: 14px;
    }
    #bagShaping button {
      min-width: 0;
    }
  }

  #boot {
    position: fixed;
    inset: 0;
    display: grid;
    place-items: center;
    background: var(--boot);
    transition: opacity 0.4s;
  }
  #boot.gone {
    opacity: 0;
    pointer-events: none;
  }
  #boot p {
    font-weight: 700;
    color: var(--ink);
  }

  @media (max-width: 600px) {
    #stats,
    #purse em {
      display: none;
    }
    #purse {
      gap: 9px;
      padding-left: 12px;
    }
    #purse button {
      padding: 0 14px;
    }
  }
  /*
   * A phone on its side, or any window as short: under five hundred pixels high the panels are the whole of the height
   * if they stand as they do upright, so each is given less. The hole's words go in two columns (the pin and the wind
   * beside the strokes, the greens' speed dropped), the purse is the coins alone, the switch stands in a column at the
   * right edge (it was a row at the bottom, where the bag has to go) and the frame's cost is away as on a phone upright,
   * the help is a narrow chip at the left foot with the map above it, and the bag takes what is between that and the
   * switch, in three short rows, the shape and spin a little below a thumb since they are touched once a shot and the
   * clubs, which are touched for every one, are not. Last in the sheet, so it wins over the upright phone's rules where
   * a landscape one is also narrow.
   */
  @media (max-height: 500px) {
    #stats,
    #purse em {
      display: none;
    }
    #purse {
      gap: 9px;
      padding-left: 12px;
    }
    #purse button {
      padding: 0 14px;
    }
    #strokes {
      grid-template-columns: auto auto auto;
      padding: 6px 14px 8px;
    }
    #holeName .of {
      grid-area: 1 / 1 / 2 / 3;
    }
    #holeName .name {
      grid-area: 2 / 1 / 3 / 3;
      margin-bottom: 2px;
    }
    #pin {
      grid-area: 2 / 3 / 3 / 4;
      align-self: end;
      margin: 0 0 2px 10px;
    }
    #wind {
      grid-area: 3 / 3 / 4 / 4;
      margin-left: 10px;
    }
    #greens {
      display: none;
    }
    /* the switch is a row under the coins and the shop, at the top right, and the help is away */
    #viewMode {
      right: calc(16px + env(safe-area-inset-right, 0px));
      top: calc(16px + 64px + 10px + env(safe-area-inset-top, 0px));
      bottom: auto;
      flex-direction: row;
      border-radius: 999px;
    }
    #viewMode button,
    #viewMode #viewFlag {
      min-width: 56px;
    }
    #viewMode #viewFlag {
      min-width: 44px;
    }
    #help {
      display: none;
    }
    #holePanel {
      top: auto;
      bottom: 16px;
      translate: none;
    }
    #bag {
      left: calc(16px + 56px + 8px);
      right: 16px;
      width: fit-content;
      max-width: none;
      margin: 0 auto;
      translate: none;
      gap: 3px;
      padding: 3px 6px 5px;
    }
    #bagInfo {
      font-size: 12px;
      line-height: 1.2;
      text-align: center;
    }
    #bag button {
      min-width: 36px;
      padding: 0 5px;
      font-size: 14px;
    }
    #bagShaping button {
      min-width: 0;
      min-height: 36px;
      font-size: 13px;
    }
    #card,
    #shop,
    #start {
      padding: 12px 16px 16px;
    }
    #card h2,
    #shop h2 {
      margin-bottom: 4px;
      font-size: 20px;
    }
    #card td {
      padding: 1px 6px;
    }
    #start h1 {
      font-size: 34px;
      text-shadow: 0 3px 0 var(--sun);
    }
    #start p {
      margin: 4px 0 10px;
    }
    #courses {
      gap: 8px 12px;
    }
    #courses .course {
      min-height: 68px;
      padding: 8px 14px 10px;
    }
    .course b {
      font-size: 20px;
    }
  }
  /* a player who has asked for less motion gets none: every panel and button is there, or gone, at once */
  @media (prefers-reduced-motion: reduce) {
    .panel,
    .panel * {
      transition: none !important;
      animation: none !important;
    }
  }
</style>
